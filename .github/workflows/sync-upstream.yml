name: sync-upstream

# weekly, and on demand: bring upstream kru (public, github.com/ap-justin/kru)
# into this fork with scripts/sync-upstream.sh — upstream recorded as a merge
# parent, the tree regenerated by scripts/port.mjs, so no text conflict can
# happen — run every check, and propose the result as a pull request. when the
# port can't take the new upstream (it reworded a line a rule needs), an issue
# says what broke instead. nothing here merges, tags or releases: Kai (kru's
# PM bot) reviews the pull request. skills/kru-roster/fork-sync.md is the runbook.
#
# verify.sh runs upstream's code (its hook tests, audit.sh) before anyone has
# read it. that is its own job: contents: read only, no stored credentials, no
# token in the environment, and no output but the ok flag. the sync job does
# not run that code. before the verify job starts, the sync job records the
# bundle's sha256 and the upload's artifact id as its outputs. the propose job
# downloads that artifact by id and checks the sha256 before it fetches, and
# it runs no repo code. every value crossing into a script goes through env:,
# never ${{ }} inside run:, and the propose job re-checks each one
# (scripts/workflows.test.sh holds these rules).
on:
  schedule:
    - cron: "23 6 * * 1" # mondays 06:23 utc
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      UPSTREAM_URL: https://github.com/ap-justin/kru.git
    outputs:
      exists: ${{ steps.branch.outputs.exists }}
      branch: ${{ steps.branch.outputs.name }}
      base: ${{ steps.branch.outputs.base }}
      status: ${{ steps.sync.outputs.status }}
      upstream_version: ${{ steps.sync.outputs.upstream_version }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      bundle_sha: ${{ steps.bundle.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: pick the branch for this upstream commit
        id: branch
        env:
          # read-only, and only here: nothing from upstream has run yet
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          up=$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)
          [[ $up =~ ^[0-9a-f]{40}$ ]] || { echo "could not read upstream main"; exit 1; }
          short=${up:0:8}
          echo "name=sync/upstream-$short" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # one proposal per upstream commit: a pull request from its branch, or
          # an issue naming it, in any state, means it was handled. a run that
          # pushed the branch but failed to open the pull request is retried
          prs=$(gh pr list --repo "$REPO" --head "sync/upstream-$short" --state all --json number --jq length)
          issues=$(gh issue list --repo "$REPO" --state all --search "$short in:title" --json number --jq length)
          if [ "${prs:-0}" != 0 ] || [ "${issues:-0}" != 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "upstream $short is already proposed"
          fi

      - name: merge upstream and regenerate
        id: sync
        if: steps.branch.outputs.exists != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          KRU_UPSTREAM_URL: ${{ env.UPSTREAM_URL }}
          KRU_SYNC_REPORT: ${{ runner.temp }}/out/report.md
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          set +e
          bash scripts/sync-upstream.sh
          code=$?
          set -e
          # 2 = the port failed on the new upstream: report it, don't fail the run
          [ "$code" = 0 ] || [ "$code" = 2 ] || exit "$code"

      # sha256 is an output of this job, recorded before the verify job runs
      # upstream's code. the upload below records the artifact id the same way.
      - name: bundle the sync commit
        id: bundle
        if: steps.sync.outputs.status == 'synced'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          git bundle create "$RUNNER_TEMP/out/sync.bundle" "$BASE..refs/heads/$BRANCH"
          sha=$(sha256sum "$RUNNER_TEMP/out/sync.bundle" | awk '{print $1}')
          [[ $sha =~ ^[0-9a-f]{64}$ ]] || { echo "sha256sum did not print a hash"; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        if: steps.sync.outputs.status == 'synced' || steps.sync.outputs.status == 'port-failed'
        with:
          name: sync
          path: ${{ runner.temp }}/out/
          retention-days: 7
          overwrite: true

  verify:
    needs: sync
    if: needs.sync.outputs.status == 'synced'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
    env:
      BRANCH: ${{ needs.sync.outputs.branch }}
      BASE: ${{ needs.sync.outputs.base }}
      BUNDLE_SHA: ${{ needs.sync.outputs.bundle_sha }}
      ARTIFACT_ID: ${{ needs.sync.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.sync.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - run: python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - name: gitleaks (pinned, checksum-verified)
        run: |
          v=8.28.0
          sum=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: check the bundle handed over
        run: |
          [[ $BRANCH =~ ^sync/upstream-[0-9a-f]{8}$ ]] || { echo "bad branch name"; exit 1; }
          [[ $BASE =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit id"; exit 1; }
          [[ $BUNDLE_SHA =~ ^[0-9a-f]{64}$ ]] || { echo "bad bundle sha"; exit 1; }
          [[ $ARTIFACT_ID =~ ^[0-9]+$ ]] || { echo "bad artifact id"; exit 1; }
      # by id, not by name: a later job can overwrite the name, which mints a
      # new id and drops this one. merge-multiple puts this one id's files in path.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sync.outputs.artifact_id }}
          path: ${{ runner.temp }}/sync
          merge-multiple: true
      - name: check the sha256 and fetch the bundle
        run: |
          echo "$BUNDLE_SHA  $RUNNER_TEMP/sync/sync.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/sync/sync.bundle"
          git fetch --no-tags "$RUNNER_TEMP/sync/sync.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          git merge-base --is-ancestor "$BASE" "refs/heads/$BRANCH"
          git switch --detach "refs/heads/$BRANCH"

      - name: verify (no token; runs upstream's code)
        id: verify
        run: |
          set +e
          bash scripts/verify.sh > "$RUNNER_TEMP/verify.log" 2>&1
          code=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/verify.log"
          echo "ok=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/verify" && awk '/^== summary/ { f = 1 } f' "$RUNNER_TEMP/verify.log" > "$RUNNER_TEMP/verify/summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify
          path: ${{ runner.temp }}/verify/
          retention-days: 7
          overwrite: true

  propose:
    needs: [sync, verify]
    if: >-
      always() &&
      needs.sync.result == 'success' &&
      (needs.sync.outputs.status == 'port-failed' ||
       (needs.sync.outputs.status == 'synced' && needs.verify.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      STATUS: ${{ needs.sync.outputs.status }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      BASE: ${{ needs.sync.outputs.base }}
      VERSION: ${{ needs.sync.outputs.upstream_version }}
      UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
      BUNDLE_SHA: ${{ needs.sync.outputs.bundle_sha }}
      ARTIFACT_ID: ${{ needs.sync.outputs.artifact_id }}
      VERIFY_OK: ${{ needs.verify.outputs.ok }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.sync.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      # the sync job does not run upstream's code, and the verify job outputs
      # nothing but ok. what they hand over is still checked before a download,
      # a fetch, a push, a title or a branch name.
      - name: check what the earlier jobs handed over
        run: |
          [[ $BRANCH =~ ^sync/upstream-[0-9a-f]{8}$ ]] || { echo "bad branch name"; exit 1; }
          [[ $BASE =~ ^[0-9a-f]{40}$ && $UPSTREAM_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit id"; exit 1; }
          [ "${BRANCH#sync/upstream-}" = "${UPSTREAM_SHA:0:8}" ] || { echo "branch and upstream commit disagree"; exit 1; }
          [ -z "$VERSION" ] || [[ $VERSION =~ ^[0-9A-Za-z.+-]{1,64}$ ]] || { echo "bad version"; exit 1; }
          [[ $ARTIFACT_ID =~ ^[0-9]+$ ]] || { echo "bad artifact id"; exit 1; }
          if [ "$STATUS" = synced ]; then
            [[ $BUNDLE_SHA =~ ^[0-9a-f]{64}$ ]] || { echo "bad bundle sha"; exit 1; }
            [ "$VERIFY_OK" = true ] || [ "$VERIFY_OK" = false ] || { echo "bad verify flag"; exit 1; }
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sync.outputs.artifact_id }}
          path: ${{ runner.temp }}/sync
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.STATUS == 'synced'
        with:
          name: verify
          path: ${{ runner.temp }}/verify

      - name: check the bundle and fetch it
        run: |
          [ -f "$RUNNER_TEMP/sync/report.md" ] || { echo "no report"; exit 1; }
          if [ "$STATUS" = synced ]; then
            echo "$BUNDLE_SHA  $RUNNER_TEMP/sync/sync.bundle" | sha256sum -c -
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git bundle verify "$RUNNER_TEMP/sync/sync.bundle"
            git fetch --no-tags "$RUNNER_TEMP/sync/sync.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
            git merge-base --is-ancestor "$BASE" "refs/heads/$BRANCH"
            git merge-base --is-ancestor "$UPSTREAM_SHA" "refs/heads/$BRANCH"
          fi

      - name: push the branch
        id: push
        if: env.STATUS == 'synced'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          set +e
          # the bot's own branch: a rerun after a failed pull request replaces it
          git push --force origin "refs/heads/$BRANCH:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/push.err" >&2
          echo "ok=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: open the pull request
        if: env.STATUS == 'synced' && steps.push.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/sync/report.md" > "$body"
          if [ "$VERIFY_OK" = true ]; then
            printf '\n### verify.sh\n\nAll checks passed.\n\n' >> "$body"
          else
            cat >> "$body" <<'EOF'

          ### verify.sh

          **Failing.** Fix on this branch before merging (`node scripts/port.mjs`, then `bash scripts/verify.sh`). The summary:

          EOF
          fi
          # indent every line so a fence, a link or a mention in the summary
          # (upstream's own verify output) cannot leave the code block
          {
            echo '```'
            sed 's/^/    /' "$RUNNER_TEMP/verify/summary.txt"
            echo '```'
          } >> "$body"
          cat >> "$body" <<'EOF'

          Opened by the weekly `sync-upstream` workflow. The verify result above came from a job that ran upstream's code before review, so read it as that code's own report; a pull request opened with the workflow token starts no other workflow, so push a commit to run CI. Releasing after the merge: `skills/kru-roster/release.md`.
          EOF
          draft=()
          [ "$VERIFY_OK" = true ] || draft=(--draft)
          url=$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "sync: upstream kru ${VERSION:-?}" --body-file "$body" "${draft[@]}")
          echo "$url"
          # an older sync pull request still open is superseded by this one
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select((.headRefName | startswith("sync/upstream-")) and .headRefName != env.BRANCH) | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by $url."; done

      # the workflow token can't push a commit that touches .github/workflows/,
      # which upstream's history can carry even though its files aren't taken
      - name: open an issue when the push is refused
        if: env.STATUS == 'synced' && steps.push.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/issue-body.md"
          tick=$'\x60'
          fence="${tick}${tick}${tick}"
          {
            printf '## The sync branch could not be pushed\n\n'
            printf 'Upstream %s merged and regenerated cleanly, but pushing %s was refused. A refusal naming %s means upstream changed a workflow file, which the workflow token may not push: run the sync by hand (%s) and push with your own credentials.\n\n' \
              "${tick}${UPSTREAM_SHA:0:8}${tick}" "${tick}${BRANCH}${tick}" "${tick}.github/workflows${tick}" "${tick}skills/kru-roster/fork-sync.md${tick}"
            printf '%s\n%s\n%s\n\n' "$fence" "$(tail -n 20 "$RUNNER_TEMP/push.err")" "$fence"
            cat "$RUNNER_TEMP/sync/report.md"
          } > "$body"
          title="upstream push refused: kru ${VERSION:-?} (${UPSTREAM_SHA:0:8})"
          existing=$(gh issue list --state open --search "in:title \"upstream push refused\" in:title \"${UPSTREAM_SHA:0:8}\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: open an issue when the port can't take upstream
        if: env.STATUS == 'port-failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="upstream port failed: kru ${VERSION:-?} (${UPSTREAM_SHA:0:8})"
          existing=$(gh issue list --state open --search "in:title \"upstream port failed\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            # the title names the newest commit, which is how the next run finds it handled
            gh issue edit "$existing" --title "$title"
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/sync/report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/sync/report.md"
          fi
